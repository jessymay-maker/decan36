// Cartesian Conversion:
// Using normal SVG Math where 0 is 3 o'clock, 90 is 6 o'clock.
// By subtracting angle from 180, we move Counter-Clockwise and start Aries at 9 o'clock.
function polarToCartesian(cx, cy, radius, angleInDegrees) {
    const angleInRadians = angleInDegrees * Math.PI / 180.0;
    return {
        x: cx + (radius * Math.cos(angleInRadians)),
        y: cy + (radius * Math.sin(angleInRadians)) // Standard Y down for SVG
    };
}

// Generate sector path instructions
function describeSector(x, y, innerRadius, outerRadius, startAngle, endAngle) {
    const p1 = polarToCartesian(x, y, outerRadius, startAngle);
    const p2 = polarToCartesian(x, y, outerRadius, endAngle);
    const p3 = polarToCartesian(x, y, innerRadius, endAngle);
    const p4 = polarToCartesian(x, y, innerRadius, startAngle);

    // Because we are drawing from startAngle (larger numerical degree) to endAngle (smaller numerical degree) 
    // to achieve counter-clockwise drawing, the sweep flag must be 0
    const largeArcFlag = Math.abs(startAngle - endAngle) > 180 ? 1 : 0;
    
    return [
        "M", p1.x, p1.y,
        "A", outerRadius, outerRadius, 0, largeArcFlag, 0, p2.x, p2.y,
        "L", p3.x, p3.y,
        "A", innerRadius, innerRadius, 0, largeArcFlag, 1, p4.x, p4.y,
        "Z"
    ].join(" ");
}

function initWheel() {
    const svg = document.getElementById('astro-wheel');
    
    // Draw 12 Signs
    // Aries starts at 180 deg (9 o'clock). 
    // We subtract angles to move counter-clockwise.
    for (let i = 0; i < 12; i++) {
        // e.g., i=0 (Aries) -> 180 to 150
        // i=3 (Cancer) -> 90 to 60 (starts at 6 o'clock)
        let startAngle = 180 - (i * 30);
        let endAngle = 180 - ((i + 1) * 30);
        
        let sign = signs[i];
        let path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", describeSector(CX, CY, R_INNER_SIGN, R_OUTER_SIGN, startAngle, endAngle));
        path.setAttribute("fill", colors[sign.element]);
        path.setAttribute("stroke", colors[sign.element + "Border"]);
        path.setAttribute("stroke-width", "3");
        svg.appendChild(path);

        let midAngle = (startAngle + endAngle) / 2;
        let tPos = polarToCartesian(CX, CY, (R_OUTER_SIGN + R_INNER_SIGN) / 2, midAngle);
        let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", tPos.x);
        text.setAttribute("y", tPos.y);
        text.setAttribute("class", "text-sign");
        
        // Ensure text is upright and readable
        let textRot = midAngle;
        let normalizedMid = ((midAngle % 360) + 360) % 360; // handle negatives
        if (normalizedMid > 90 && normalizedMid < 270) {
            textRot += 180;
        }
        text.setAttribute("transform", `rotate(${textRot}, ${tPos.x}, ${tPos.y})`);
        text.textContent = sign.name;
        svg.appendChild(text);
    }

    // Draw 36 Decans
    decanData.forEach((d, i) => {
        let startAngle = 180 - (i * 10);
        let endAngle = 180 - ((i + 1) * 10);
        
        let pPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pPath.setAttribute("d", describeSector(CX, CY, R_INNER_DECAN, R_OUTER_DECAN, startAngle, endAngle));
        pPath.setAttribute("fill", colors[d.element]);
        pPath.setAttribute("class", "sector");
        pPath.setAttribute("data-id", d.decan);
        
        // Add hover and click events
        pPath.onmouseover = () => selectDecan(d.decan, false);
        pPath.onclick = () => selectDecan(d.decan, true);
        
        svg.appendChild(pPath);

        let midAngle = (startAngle + endAngle) / 2;
        let planetPos = polarToCartesian(CX, CY, (R_OUTER_DECAN + R_INNER_DECAN) / 2, midAngle);
        
        let ptText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        ptText.setAttribute("x", planetPos.x);
        ptText.setAttribute("y", planetPos.y);
        ptText.setAttribute("class", "text-planet");
        
        let pRotAngle = midAngle + 90; // Rotate to stand upright along the radial
        let pNormalizedMid = ((midAngle % 360) + 360) % 360;
        if (pNormalizedMid > 90 && pNormalizedMid <= 270) {
            pRotAngle += 180;
        }
        
        ptText.setAttribute("transform", `rotate(${pRotAngle}, ${planetPos.x}, ${planetPos.y})`);
        
        // Extract just the symbol
        let symbol = d.planet.split(" ")[1] || d.planet;
        ptText.textContent = symbol;
        svg.appendChild(ptText);
    });

    // Inner Blank Center Circle
    let centerCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    centerCircle.setAttribute("cx", CX);
    centerCircle.setAttribute("cy", CY);
    centerCircle.setAttribute("r", R_INNER_DECAN);
    centerCircle.setAttribute("fill", "#fff");
    centerCircle.setAttribute("stroke", "#94a3b8");
    centerCircle.setAttribute("stroke-width", "4");
    svg.appendChild(centerCircle);
    
    let centerText = document.createElementNS("http://www.w3.org/2000/svg", "text");
    centerText.setAttribute("x", CX);
    centerText.setAttribute("y", CY);
    centerText.setAttribute("text-anchor", "middle");
    centerText.setAttribute("dominant-baseline", "middle");
    centerText.setAttribute("fill", "#475569");
    centerText.setAttribute("font-size", "28px");
    centerText.setAttribute("font-weight", "900");
    centerText.setAttribute("letter-spacing", "2px");
    centerText.textContent = "36 旬";
    svg.appendChild(centerText);
}

function initTable() {
    const tbody = document.getElementById('decan-table-body');
    decanData.forEach(d => {
        const tr = document.createElement('tr');
        tr.id = `row-${d.decan}`;
        
        let planetColor = '#334155';
        if(d.element === 'fire') planetColor = '#dc2626';
        if(d.element === 'earth') planetColor = '#d97706';
        if(d.element === 'air') planetColor = '#0284c7';
        if(d.element === 'water') planetColor = '#059669';

        tr.innerHTML = `
            <td><strong>${d.decan}</strong></td>
            <td><strong>${d.sign}</strong> <span style="color:#64748b;">${d.deg}</span></td>
            <td style="color: ${planetColor};">
                <span class="planet-symbol">${d.planet.split(" ")[1]}</span> ${d.planet.split(" ")[0]}
            </td>
            <td><span class="tarot-badge">${d.tarot}</span></td>
            <td>${d.meaning}</td>
            <td>${d.agrippa}</td>
        `;
        
        tr.onclick = () => selectDecan(d.decan, true);
        tr.onmouseover = () => selectDecan(d.decan, false);
        tbody.appendChild(tr);
    });
}

function selectDecan(decanId, scroll = false) {
    // Reset active states
    document.querySelectorAll('.sector').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('tr').forEach(el => el.classList.remove('active-row'));

    // Set new active states
    document.querySelectorAll(`.sector[data-id="${decanId}"]`).forEach(el => el.classList.add('active'));

    const row = document.getElementById(`row-${decanId}`);
    if (row) {
        row.classList.add('active-row');
        if(scroll) {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    // Update Detail Panel
    const data = decanData.find(d => d.decan === decanId);
    if (data) {
        document.getElementById('detail-content').style.display = 'block';
        document.getElementById('placeholder-text').style.display = 'none';
        
        document.getElementById('det-decan').innerText = `第 ${data.decan} 旬 | ${data.sign} ${data.deg}`;
        
        let planetColor = '#334155';
        if(data.element === 'fire') planetColor = '#dc2626';
        if(data.element === 'earth') planetColor = '#d97706';
        if(data.element === 'air') planetColor = '#0284c7';
        if(data.element === 'water') planetColor = '#059669';
        
        document.getElementById('det-planet').innerHTML = `<span style="font-size: 2.5rem; color: ${planetColor}">${data.planet.split(" ")[1]}</span> ${data.planet.split(" ")[0]}`;
        
        document.getElementById('det-meaning').innerText = data.meaning;
        document.getElementById('det-tarot').innerText = data.tarot;
        document.getElementById('det-agrippa').innerText = data.agrippa;
    }
}

window.onload = () => {
    initWheel();
    initTable();
};
</script>
</body>
</html>
