<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卜卦盤張力量化計算器 v1.0</title>
<style>
  :root{
    --bg:#0f1220; --panel:#1a1f36; --panel2:#232a47;
    --ink:#e8ebf5; --muted:#9aa3c7; --accent:#7cc4ff;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --line:#333c63;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#0b0e1a,#141a30 60%,#0b0e1a);
    color:var(--ink); line-height:1.6; padding:24px;
  }
  .wrap{max-width:980px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:1.05rem;margin:0 0 14px;color:var(--accent);letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px}
  input,select{
    width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:.95rem;font-family:inherit;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{
    padding:10px 18px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:.9rem;cursor:pointer;font-family:inherit;
    transition:.15s;
  }
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#0b0e1a;border-color:var(--accent);font-weight:600}
  button.primary:hover{opacity:.88;color:#0b0e1a}
  .out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:8px}
  .stat{background:var(--panel2);border-radius:11px;padding:14px 16px;border:1px solid var(--line)}
  .stat .k{font-size:.75rem;color:var(--muted);margin-bottom:4px}
  .stat .v{font-size:1.5rem;font-weight:600;font-feature-settings:"tnum"}
  .verdict{margin-top:16px;padding:14px 16px;border-radius:11px;border-left:4px solid var(--accent);background:var(--panel2);font-size:.95rem}
  .verdict.good{border-left-color:var(--good)}
  .verdict.warn{border-left-color:var(--warn)}
  .verdict.bad{border-left-color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:.78rem}
  td.num{font-feature-settings:"tnum";text-align:right}
  .detail{font-size:.82rem;color:var(--muted);margin-top:10px}
  .detail code{background:var(--panel2);padding:2px 6px;border-radius:5px;color:var(--accent);font-size:.8rem}
  .hint{font-size:.78rem;color:var(--muted);margin-top:8px}
  .sep{border:0;border-top:1px solid var(--line);margin:16px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>卜卦盤張力量化計算器 <span style="color:var(--muted);font-size:.8rem">v1.0</span></h1>
  <div class="sub">依規格書：w_asp = cos²(π/2 · orb/max_orb)；T_AB = s·W·w_asp·(1+ρ) − d_AB</div>

  <div class="card">
    <h2>① 主體行星（A）</h2>
    <div class="grid">
      <div><label>名稱</label><input id="a_name" value="金星 L1"></div>
      <div><label>黃經 λ (°)</label><input id="a_lon" type="number" step="0.01" value="192"></div>
      <div><label>宮位</label><input id="a_house" type="number" value="1"></div>
      <div><label>逆行</label><select id="a_retro"><option value="0">否</option><option value="1">是</option></select></div>
      <div><label>受剋扣分 d_A</label><input id="a_deb" type="number" step="0.1" value="0"></div>
    </div>
  </div>

  <div class="card">
    <h2>② 目標行星（B）</h2>
    <div class="grid">
      <div><label>名稱</label><input id="b_name" value="火星 B"></div>
      <div><label>黃經 λ (°)</label><input id="b_lon" type="number" step="0.01" value="197"></div>
      <div><label>宮位</label><input id="b_house" type="number" value="1"></div>
      <div><label>逆行</label><select id="b_retro"><option value="0">否</option><option value="1">是</option></select></div>
      <div><label>受剋扣分 d_B</label><input id="b_deb" type="number" step="0.1" value="0"></div>
    </div>
    <hr class="sep">
    <h2 style="margin-top:0">③ 目標方向</h2>
    <div class="grid">
      <div><label>目標宮中心黃經 (°) → 方向向量 û_B</label><input id="b_dir" type="number" step="0.01" value="15"></div>
      <div><label>B 是否在 A 的宮主星座 (ρ=+0.4)</label><select id="rho"><option value="0.4">是（宮主）</option><option value="0.3">界主 +0.3</option><option value="0.2">三分性 +0.2</option><option value="0" selected>否</option></select></div>
      <div><label>月亮權重 w_M（若主體為月亮時）</label><input id="wM" type="number" step="0.05" value="0.8"></div>
      <div><label>Δt（天，用於趨勢）</label><input id="dt" type="number" step="0.5" value="1"></div>
      <div><label>主體每日黃經速度 (°/day，金星≈1.2)</label><input id="a_speed" type="number" step="0.01" value="1.2"></div>
    </div>
    <div class="row">
      <button class="primary" onclick="compute()">計算張力</button>
      <button onclick="loadExample()">載入 §9 算例</button>
    </div>
    <div class="hint">註：輸入黃經時，同星座以 0–360 度絕對值；orb 計算自動取 0–180°。</div>
  </div>

  <div class="card">
    <h2>④ 計算結果</h2>
    <div class="out" id="stats">
      <div class="stat"><div class="k">T_AB</div><div class="v">—</div></div>
      <div class="stat"><div class="k">𝒯 (合張力)</div><div class="v">—</div></div>
      <div class="stat"><div class="k">align（對齊度）</div><div class="v">—</div></div>
      <div class="stat"><div class="k">trend（/天）</div><div class="v">—</div></div>
    </div>
    <div id="verdictBox" class="verdict" style="display:none"></div>
    <div id="breakdown"></div>
  </div>
</div>

<script>
const ASPECTS = [
  {name:"合相", deg:0,   symbol:+1, W:1.0, orb:8},
  {name:"六分", deg:60,  symbol:+1, W:0.6, orb:6},
  {name:"四分", deg:90,  symbol:-1, W:0.8, orb:7},
  {name:"三分", deg:120, symbol:+1, W:0.8, orb:7},
  {name:"沖相", deg:180, symbol:-1, W:1.0, orb:8},
];

const D2R = Math.PI/180;

function angDiff(a,b){
  let d = Math.abs(a-b) % 360;
  if (d > 180) d = 360 - d;
  return d;
}

// 找最佳相位：回傳 {asp, orb, signedOrb}
function findAspect(la, lb){
  let best = null;
  for (const asp of ASPECTS){
    const sep = angDiff(la, lb);
    const orb = Math.abs(sep - asp.deg);
    if (orb < asp.orb && (best===null || orb < best.orb)){
      best = {asp, orb};
    }
  }
  return best;
}

// 入相/出相：用黃經差隨時間的變化號。
// 近似：以快星黃經 a_speed 前進，計算 orb 是否縮小。
function direction(la, lb, aspDeg, orb0, speed){
  const step = 0.01;
  const sep1 = angDiff(la + speed*step, lb);
  const orb1 = Math.abs(sep1 - aspDeg);
  // orb1 < orb0 => 正在接近 exact => applicative (+1)
  return (orb1 < orb0) ? +1 : -1;
}

function wAsp(orb, maxOrb){
  const r = orb / maxOrb;
  const c = Math.cos(Math.PI/2 * r);
  return c*c;
}

function norm360(x){ return ((x%360)+360)%360; }

function loadExample(){
  document.getElementById('a_name').value='金星 L1';
  document.getElementById('a_lon').value=192;   // 12° 天秤 = 180+12
  document.getElementById('a_house').value=1;
  document.getElementById('a_deb').value=0;
  document.getElementById('b_name').value='火星 B';
  document.getElementById('b_lon').value=197;   // 17° 天秤
  document.getElementById('b_house').value=1;
  document.getElementById('b_deb').value=0;
  document.getElementById('b_dir').value=15;    // 15° 白羊 = 指向 7 宮
  document.getElementById('rho').value='0.4';
  document.getElementById('a_speed').value=1.2;
  document.getElementById('dt').value=1;
  compute();
}

function singlePair(la, lb, rho, dA, dB, speed){
  const found = findAspect(la, lb);
  if (!found) return {T:0, detail:{hit:false}};
  const {asp, orb} = found;
  const w = wAsp(orb, asp.orb);
  const dirSign = direction(la, lb, asp.deg, orb, speed);
  const B = asp.symbol * asp.W * w;
  const R = B * (1 + rho);
  // 方向只影響「走向」，v1 中把它作為符號修正：separating 視為衰減趨勢，不翻轉 T
  const d = 0.5 * (dA + dB);
  const T = R - d;
  return {T, detail:{
    hit:true, asp:asp.name, deg:asp.deg, orb:orb, maxOrb:asp.orb,
    w, symbol:asp.symbol, W:asp.W, B, rho, R, d, dirSign
  }};
}

function compute(){
  const la = parseFloat(document.getElementById('a_lon').value);
  const lb = parseFloat(document.getElementById('b_lon').value);
  const rho = parseFloat(document.getElementById('rho').value);
  const dA = parseFloat(document.getElementById('a_deb').value)||0;
  const dB = parseFloat(document.getElementById('b_deb').value)||0;
  const speed = parseFloat(document.getElementById('a_speed').value)||0;
  const dt = parseFloat(document.getElementById('dt').value)||1;
  const dirB = parseFloat(document.getElementById('b_dir').value);
  const wM = parseFloat(document.getElementById('wM').value)||0.8;

  const r1 = singlePair(la, lb, rho, dA, dB, speed);

  // 目標方向向量
  const ux = Math.cos(dirB*D2R), uy = Math.sin(dirB*D2R);
  const Tx = r1.T * ux, Ty = r1.T * uy;

  const T = Math.hypot(Tx, Ty);
  const align = T>0 ? (Tx*ux + Ty*uy)/T : 0;

  // 趨勢：Δt 後，A 前進 speed*dt
  const la2 = la + speed*dt;
  const r2 = singlePair(la2, lb, rho, dA, dB, speed);
  const Tx2 = r2.T * ux, Ty2 = r2.T * uy;
  const T2 = Math.hypot(Tx2, Ty2);
  const trend = (T2 - T)/dt;

  // 顯示
  document.querySelector('.out').innerHTML = `
    <div class="stat"><div class="k">T_AB</div><div class="v">${r1.T.toFixed(3)}</div></div>
    <div class="stat"><div class="k">𝒯 (合張力)</div><div class="v">${T.toFixed(3)}</div></div>
    <div class="stat"><div class="k">align（對齊度）</div><div class="v">${T>0?align.toFixed(2):"—"}</div></div>
    <div class="stat"><div class="k">trend（/天）</div><div class="v">${trend>=0?'+':''}${trend.toFixed(3)}</div></div>
  `;

  let bd = "";
  if (r1.detail.hit){
    const d = r1.detail;
    bd = `<table>
      <tr><th>項目</th><th>值</th><th>說明</th></tr>
      <tr><td>相位</td><td class="num">${d.asp}</td><td>${d.deg}°</td></tr>
      <tr><td>orb</td><td class="num">${d.orb.toFixed(3)}°</td><td>容許 ±${d.maxOrb}°</td></tr>
      <tr><td>w_asp</td><td class="num">${d.w.toFixed(4)}</td><td>cos²(π/2·orb/max)</td></tr>
      <tr><td>s · W</td><td class="num">${d.symbol} · ${d.W}</td><td>符號 · 權重</td></tr>
      <tr><td>B_asp</td><td class="num">${d.B.toFixed(4)}</td><td>s·W·w</td></tr>
      <tr><td>ρ</td><td class="num">+${d.rho}</td><td>容納乘數</td></tr>
      <tr><td>R_AB</td><td class="num">${d.R.toFixed(4)}</td><td>B·(1+ρ)</td></tr>
      <tr><td>d_AB</td><td class="num">${d.d.toFixed(4)}</td><td>受剋扣分</td></tr>
      <tr><td><b>T_AB</b></td><td class="num"><b>${d.T = r1.T, r1.T.toFixed(4)}</b></td><td>R − d</td></tr>
      <tr><td>方向</td><td class="num">${d.dirSign>0?'入相位 +1':'出相位 −1'}</td><td>orb 變化判定</td></tr>
    </table>`;
  } else {
    bd = `<div class="detail">A 與 B 在容許度內無主要相位 → T_AB = 0，訊號弱／盤不顯。</div>`;
  }

  let vClass="", vText="";
  if (!r1.detail.hit){
    vClass="warn"; vText="訊號弱：主體與目標之間無相位，事情不明朗或盤不顯。";
  } else if (align > 0.7 && trend > 0){
    vClass="good"; vText=`順利：張力（𝒯=${T.toFixed(2)}）強且完全對齊目標，入相位使張力上升（trend=+${trend.toFixed(2)}），事情正收斂向完成。`;
  } else if (align > 0.7 && trend <= 0){
    vClass="warn"; vText=`方向正確但張力衰減（trend=${trend.toFixed(2)}）：可能已接近完成或正在消退，需看是否已 perfect。`;
  } else if (align < 0){
    vClass="bad"; vText=`淨背離（align=${align.toFixed(2)}）：主體與目標的關係淨拉離，事情不順。`;
  } else {
    vClass="warn"; vText=`方向偏斜（align=${align.toFixed(2)}）：有力但未直指目標，進展可能走樣或受阻。`;
  }
  const vbox = document.getElementById('verdictBox');
  vbox.className = "verdict " + vClass;
  vbox.textContent = vText;
  vbox.style.display = "block";

  document.getElementById('breakdown').innerHTML =
    `<hr class="sep"><div class="detail"><b>逐步推導：</b></div>${bd}
     <div class="detail" style="margin-top:10px">
       û_B = (${ux.toFixed(3)}, ${uy.toFixed(3)})，T⃗ = T_AB·û_B；
       𝒯 = |T⃗| = ${T.toFixed(3)}；align = T⃗·û_B / 𝒯 = ${align.toFixed(3)}。
     </div>`;
}

// 初始載入算例
window.addEventListener('DOMContentLoaded', loadExample);
</script>
</body>
</html>
